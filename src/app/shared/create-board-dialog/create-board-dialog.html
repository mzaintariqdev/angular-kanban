<h2 mat-dialog-title class="dialog-title">Create New Board</h2>

<mat-dialog-content class="dialog-content">
  <mat-form-field appearance="outline" class="full-width">
    <mat-label>Board Name</mat-label>
    <input matInput [(ngModel)]="model.name" placeholder="e.g. Work Projects" />
  </mat-form-field>

  <mat-form-field appearance="outline" class="full-width">
    <mat-label>Description</mat-label>
    <input matInput [(ngModel)]="model.description" placeholder="Short description..." />
  </mat-form-field>
</mat-dialog-content>

<mat-dialog-actions align="end" class="dialog-actions">
  <button mat-button (click)="cancel()">Cancel</button>

  <button mat-flat-button color="primary" (click)="create()" [disabled]="!model.name.trim()">
    Create Board
  </button>
</mat-dialog-actions>
