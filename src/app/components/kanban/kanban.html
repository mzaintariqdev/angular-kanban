<div class="board">
  @for (column of columns(); track column.id) {
    <app-kanban-column
      [column]="column"
      [connectedLists]="connectedLists"
      [dropped]="drop.bind(this)"
    />
  }

  @if (columns().length < 5) {
    <div class="add-column-card" (click)="openAddColumnDialog()">+ Add Column</div>
  }
</div>
